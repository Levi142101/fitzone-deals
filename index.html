  const filtered=filter==="all"?P:P.filter(p=>p.c===filter);
  const disc=(o,n)=>Math.round((1-n/o)*100);
  const fmtR=n=>n>=1000?(n/1000).toFixed(1)+"k":n;
  const ticker=P.slice(0,12).map(p=>`${CATS[p.c]?.i||"🔥"} ${p.n} — ${disc(p.o,p.p)}% OFF`);

  // Track image index per category
  const catIdx={};
  const getCatIdx=(cat)=>{catIdx[cat]=(catIdx[cat]||0);return catIdx[cat]++;}

  return(
    <div>
      {/* HEADER */}
      <div style={{position:"fixed",top:0,width:"100%",zIndex:200,background:"rgba(17,17,17,.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
        <div style={{maxWidth:1200,margin:"0 auto",padding:"0 20px",height:50,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:"1.3rem"}}>💪</span>
            <span style={{fontFamily:"'Bebas Neue'",fontSize:"1.35rem",color:"#fff",letterSpacing:1.5}}>FITZONE</span>
            <span style={{background:"#ff3b30",color:"#fff",fontSize:".48rem",fontWeight:800,padding:"2px 6px",borderRadius:3}}>DEALS</span>
          </div>
          <div style={{display:"flex",gap:2}}>
            {["all","equipment","supplements","wearables","recovery"].map(k=>(
              <button key={k} onClick={()=>setFilter(k)} style={{background:filter===k?"#ff3b30":"transparent",color:filter===k?"#fff":"rgba(255,255,255,.5)",border:"none",padding:"4px 10px",borderRadius:6,fontSize:".7rem",fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{CATS[k]?.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* HERO */}
      <div style={{position:"relative",height:"78vh",minHeight:440,maxHeight:660,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <video autoPlay muted loop playsInline style={{position:"absolute",top:"50%",left:"50%",minWidth:"100%",minHeight:"100%",transform:"translate(-50%,-50%)",objectFit:"cover"}}>
          <source src="https://videos.pexels.com/video-files/3209237/3209237-uhd_2560_1440_25fps.mp4" type="video/mp4"/>
        </video>
        <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.3) 40%,rgba(0,0,0,.75) 100%)"}}/>
        <div style={{position:"relative",zIndex:2,textAlign:"center",maxWidth:620,padding:"0 20px"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(255,59,48,.12)",border:"1px solid rgba(255,59,48,.25)",padding:"5px 14px",borderRadius:30,fontSize:".68rem",fontWeight:700,color:"#ff6b61",textTransform:"uppercase",letterSpacing:1,marginBottom:18}}>
            <span style={{width:6,height:6,background:"#ff3b30",borderRadius:"50%",animation:"pulse 1.5s infinite"}}/> {P.length}+ live deals · Updated daily
          </div>
          <h1 style={{fontFamily:"'Bebas Neue'",fontSize:"clamp(2.4rem,7vw,4.6rem)",color:"#fff",lineHeight:.95,letterSpacing:2,marginBottom:14}}>THE BEST <span style={{color:"#ff3b30"}}>FITNESS DEALS</span><br/>ON AMAZON</h1>
          <p style={{fontSize:"1rem",color:"rgba(255,255,255,.6)",maxWidth:420,margin:"0 auto 24px"}}>Price-verified deals with 90-day history charts. Real savings only.</p>
          <a href="#deals" style={{display:"inline-flex",gap:8,background:"#ff3b30",color:"#fff",padding:"13px 30px",borderRadius:50,fontSize:".88rem",fontWeight:800,textDecoration:"none",boxShadow:"0 8px 28px rgba(255,59,48,.35)",fontFamily:"inherit"}}>Browse Deals ↓</a>
        </div>
        <div style={{position:"absolute",bottom:0,left:0,right:0,zIndex:3,background:"rgba(17,17,17,.85)",backdropFilter:"blur(16px)"}}>
          <div style={{maxWidth:1200,margin:"0 auto",padding:"11px 20px",display:"flex",justifyContent:"center",gap:32,flexWrap:"wrap"}}>
            {[[P.length+"+","Deals"],["24/7","Tracking"],["90-day","Charts"],["$0","Extra"]].map(([v,l],i)=>(
              <div key={i} style={{textAlign:"center"}}>
                <strong style={{fontFamily:"'Bebas Neue'",fontSize:"1.15rem",color:"#fff",display:"block"}}>{v}</strong>
                <span style={{fontSize:".58rem",color:"rgba(255,255,255,.4)",textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>{l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* TICKER */}
      <div style={{background:"#111",color:"#ff3b30",padding:"7px 0",overflow:"hidden",whiteSpace:"nowrap"}}>
        <div style={{display:"inline-block",animation:"scroll 55s linear infinite",fontSize:".68rem",fontWeight:800,textTransform:"uppercase",letterSpacing:.8}}>
          {[...ticker,...ticker].join("     ★     ")}
        </div>
      </div>

      {/* DEALS */}
      <div id="deals" style={{maxWidth:1200,margin:"0 auto",padding:"28px 20px 10px"}}>
        <h2 style={{fontFamily:"'Bebas Neue'",fontSize:"1.7rem",letterSpacing:1.5,lineHeight:1}}>TODAY'S <span style={{color:"#ff3b30"}}>BEST DEALS</span></h2>
        <p style={{fontSize:".78rem",color:"#888",marginTop:2}}>{filtered.length} deals · Click any card for 90-day price chart</p>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",margin:"12px 0 18px"}}>
          {Object.entries(CATS).map(([k,v])=>{
            const cnt=k==="all"?P.length:P.filter(x=>x.c===k).length;
            return cnt>0&&(
              <button key={k} onClick={()=>setFilter(k)} style={{background:filter===k?"#111":"#fff",color:filter===k?"#fff":"#666",border:"1.5px solid "+(filter===k?"#111":"#e0dcd5"),padding:"6px 13px",borderRadius:6,fontSize:".74rem",fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}>
                {v.i} {v.l} <span style={{fontSize:".58rem",opacity:.5}}>({cnt})</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* GRID */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"0 20px 40px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:12}}>
        {filtered.map((p,idx)=>{
          const open=expanded===p.id;
          const d=disc(p.o,p.p);
          return(
            <div key={p.id} className="card" style={{background:"#fff",border:"1px solid #e5e2dc",borderRadius:10,overflow:"hidden",display:"flex",flexDirection:"column",transition:"all .3s",animation:"fadeUp .4s ease forwards"}}>
              <div style={{display:"flex"}}>
                {/* PRODUCT IMAGE */}
                <div className="prod-img" style={{backgroundImage:`url(${getImg(p.c,idx)})`}}>
                  <div style={{position:"absolute",bottom:8,left:8,zIndex:1,display:"flex",gap:3}}>
                    <span style={{fontSize:".52rem",fontWeight:800,padding:"2px 6px",borderRadius:3,textTransform:"uppercase",background:p.b?.includes("OFF")?"#ff3b30":p.b==="Best Seller"?"#111":"#f59e0b",color:"#fff",backdropFilter:"blur(4px)"}}>{p.b}</span>
                  </div>
                  {d>=25&&<div style={{position:"absolute",top:8,right:8,zIndex:1,background:"rgba(230,245,236,.95)",color:"#1b7a3d",fontSize:".56rem",fontWeight:800,padding:"3px 6px",borderRadius:4}}>SAVE ${(p.o-p.p).toFixed(0)}</div>}
                </div>
                {/* INFO */}
                <div style={{flex:1,padding:"12px 14px 8px",minWidth:0}}>
                  <div style={{fontSize:".62rem",textTransform:"uppercase",letterSpacing:1.2,color:"#ff3b30",fontWeight:800,marginBottom:3}}>{CATS[p.c]?.i} {p.c}</div>
                  <div style={{fontSize:".9rem",fontWeight:800,lineHeight:1.2,marginBottom:4,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{p.n}</div>
                  <div style={{fontSize:".68rem",color:"#999",marginBottom:5}}>
                    <span style={{color:"#f59e0b"}}>{"★".repeat(Math.floor(p.r))}{p.r%1>=.5?"½":""}</span> {p.r} · {fmtR(p.rv)} reviews
                  </div>
                  <p style={{fontSize:".76rem",color:"#666",lineHeight:1.45,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{p.d}</p>
                </div>
              </div>

              <div style={{padding:"4px 14px 8px",display:"flex",gap:3,flexWrap:"wrap"}}>
                {p.t.map((x,i)=><span key={i} style={{fontSize:".6rem",fontWeight:700,background:"#f2f0ec",color:"#555",padding:"2px 7px",borderRadius:4}}>✓ {x}</span>)}
              </div>

              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderTop:"1px solid #f0eeea",background:"#fafaf8"}}>
                <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                  <span style={{fontFamily:"'Bebas Neue'",fontSize:"1.5rem"}}>${p.p.toFixed(2)}</span>
                  <span style={{fontSize:".74rem",color:"#bbb",textDecoration:"line-through"}}>${p.o.toFixed(2)}</span>
                </div>
                <span style={{fontSize:".66rem",fontWeight:800,background:"#e6f5ec",color:"#1b7a3d",padding:"3px 7px",borderRadius:4}}>Save {d}%</span>
              </div>

              <button onClick={()=>setExpanded(open?null:p.id)} style={{width:"100%",padding:7,background:"transparent",border:"none",borderTop:"1px dashed #e5e2dc",fontSize:".72rem",fontWeight:700,color:"#007aff",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                📊 {open?"Hide":"View"} Price History <span style={{fontSize:".55rem",transition:"transform .2s",transform:open?"rotate(180deg)":"",display:"inline-block"}}>▼</span>
              </button>
              {open&&<Chart op={p.o} np={p.p} id={p.a}/>}

              <a href={`https://www.amazon.com/dp/${p.a}?tag=fitzone05a-20`} target="_blank" rel="nofollow noopener" className="cta-btn"
                style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,margin:"0 14px 14px",padding:"11px",background:"#111",color:"#fff",borderRadius:7,fontSize:".82rem",fontWeight:800,textDecoration:"none",transition:"background .2s"}}>
                View Deal on Amazon →
              </a>
            </div>
          );
        })}
      </div>

      {/* TRUST */}
      <div style={{background:"#111",padding:"40px 20px"}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:18,textAlign:"center"}}>
          {[["📊","Price Charts","90-day history for every product"],["🐪","CamelCamelCamel","Links to full price tracking"],["📈","Keepa","Detailed Amazon analytics"],["🤖","AI Scanner","Auto-finds new deals daily"],["🛡️","$0 Extra","Same Amazon price always"]].map(([i,t,d],x)=>(
            <div key={x}>
              <div style={{fontSize:"1.4rem",marginBottom:6}}>{i}</div>
              <h3 style={{fontSize:".76rem",fontWeight:800,color:"#fff",marginBottom:2}}>{t}</h3>
              <p style={{fontSize:".66rem",color:"rgba(255,255,255,.3)",lineHeight:1.4}}>{d}</p>
            </div>
          ))}
        </div>
      </div>

      {/* NEWSLETTER */}
      <div style={{padding:"44px 20px",textAlign:"center",borderTop:"1px solid #e5e2dc"}}>
        <h2 style={{fontFamily:"'Bebas Neue'",fontSize:"1.5rem",letterSpacing:1.5,marginBottom:5}}>🔔 NEVER MISS A DEAL</h2>
        <p style={{color:"#888",fontSize:".84rem",marginBottom:16}}>Top deals in your inbox every morning.</p>
        <div style={{display:"flex",gap:8,maxWidth:360,margin:"0 auto"}}>
          <input placeholder="you@email.com" style={{flex:1,padding:"11px 14px",border:"2px solid #e5e2dc",borderRadius:8,fontSize:".84rem",fontFamily:"inherit"}}/>
          <button onClick={()=>alert("Subscribed! 💪")} style={{padding:"11px 20px",background:"#ff3b30",color:"#fff",border:"none",borderRadius:8,fontWeight:800,fontSize:".8rem",cursor:"pointer",fontFamily:"inherit"}}>Subscribe</button>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{borderTop:"1px solid #e5e2dc",padding:"24px 20px",textAlign:"center"}}>
        <div style={{maxWidth:560,margin:"0 auto 10px",padding:"12px 14px",background:"#f2f0ec",borderRadius:8,fontSize:".62rem",color:"#999",lineHeight:1.6}}>
          <strong>Affiliate Disclosure:</strong> FitZone participates in the Amazon Services LLC Associates Program. We earn from qualifying purchases at no cost to you. Price charts are generated estimates; visit CamelCamelCamel or Keepa for official tracking.
        </div>
        <p style={{fontSize:".7rem",color:"#bbb"}}>© 2026 FitZone Deals · Privacy · Terms · Contact</p>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
